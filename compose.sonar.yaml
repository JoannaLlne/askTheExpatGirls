# Local SonarQube server, kept separate from the application stack (compose.yaml).
#
# Requirements: Docker with WSL integration enabled, and vm.max_map_count >= 524288
# (check it with: cat /proc/sys/vm/max_map_count).
#
# Run every command from the project root:
#   Start the server:  docker compose -f compose.sonar.yaml up -d
#   Open:              http://localhost:9000 (first login: admin / admin)
#   Scan the project:  SONAR_TOKEN=<your token> docker compose -f compose.sonar.yaml run --rm sonar-scanner
#   Stop the server:   docker compose -f compose.sonar.yaml down
#
# Wait until the web UI is up before scanning. The analysis settings live in
# sonar-project.properties.

name: asktheexpatgirls-sonar

services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    ports:
      # Bound to localhost only: the server is not reachable from the network.
      - "127.0.0.1:9000:9000"

  sonarqube-db:
    image: postgres:17-alpine
    environment:
      # Local-only database, never exposed outside Docker.
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "sonar", "-U", "sonar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  # One-shot service: runs only with "docker compose run", never with "up".
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: [scan]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_PROJECT_BASE_DIR: ${PWD}
    # The project is mounted at the same path as on the host, so that the file
    # paths written in the PHPStan and coverage reports match inside the container.
    volumes:
      - .:${PWD}
    working_dir: ${PWD}

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
