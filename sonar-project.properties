# SonarQube project configuration, read by sonar-scanner.
# The server URL and the token are NOT stored here: pass them as environment
# variables (SONAR_HOST_URL, SONAR_TOKEN) so they never end up in Git.

# --- Project identity ---------------------------------------------------------
# Must be the exact key of the project created in SonarQube: the project analysis
# token is bound to it, and any other key is rejected with a 403.
sonar.projectKey=Ask-The-Expat-Girls
sonar.projectName=Ask The Expat Girls
sonar.sourceEncoding=UTF-8

# --- What to analyze ----------------------------------------------------------
# PHP code, Twig templates (HTML rules only: Twig syntax is partially supported)
# and front-end assets (Stimulus controllers, CSS).
sonar.sources=src,templates,assets
sonar.tests=tests

# Third-party code downloaded by importmap, and images.
sonar.exclusions=assets/vendor/**,assets/images/**

# --- Coverage and duplication -------------------------------------------------
# Fixtures are fake data and Kernel.php is framework boilerplate:
# they must not lower the coverage score.
sonar.coverage.exclusions=src/DataFixtures/**,src/Kernel.php
sonar.cpd.exclusions=src/DataFixtures/**

# --- External reports ---------------------------------------------------------
# Generate them before running the scanner (var/ is git-ignored):
#   mkdir -p var/reports
#   php bin/console cache:warmup --env=dev
#   vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=json > var/reports/phpstan.json
#   vendor/bin/phpunit --coverage-clover var/reports/coverage.xml --log-junit var/reports/junit.xml
# Coverage requires the pcov or xdebug PHP extension.
sonar.php.phpstan.reportPaths=var/reports/phpstan.json
sonar.php.coverage.reportPaths=var/reports/coverage.xml
sonar.php.tests.reportPath=var/reports/junit.xml

# --- Quality gate -------------------------------------------------------------
# Wait for the quality gate result and fail the scan if the gate does not pass.
sonar.qualitygate.wait=true
